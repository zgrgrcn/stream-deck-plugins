<!DOCTYPE html>
<html>

<head lang="en">
    <title>System Metric Settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>

<body>
    <sdpi-item label="Metric">
        <sdpi-select setting="metric" default="cpu">
            <option value="cpu">CPU</option>
            <option value="ram">RAM</option>
            <option value="power">Power (W)</option>
            <option value="down">Network download</option>
            <option value="up">Network upload</option>
        </sdpi-select>
    </sdpi-item>
</body>

</html>
